[package]
name = "al-fits"
description = "Lazy, seekable FITS access: read headers and pixel ranges without downloading the whole file"
license = "BSD-3-Clause"
version = "3.9.0"
edition = "2018"

[dependencies]
js-sys = "0.3.47"
wasm-bindgen = "=0.2.92"
wasm-bindgen-futures = "0.4.20"
serde_json = "1.0.104"
serde-wasm-bindgen = "0.5"

[dependencies.serde]
version = "^1.0.183"
features = [ "derive",]

[dependencies.fitsrs]
git = "https://github.com/cds-astro/fitsrs"
branch = "master"

[dependencies.web-sys]
version = "0.3.56"
features = [ "console", "Window", "WorkerGlobalScope", "Request", "RequestInit", "RequestMode", "RequestCache", "Response", "Headers", "Blob", "File",]

[dev-dependencies]
futures = "0.3.12"
